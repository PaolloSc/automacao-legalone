<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automação LegalOne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a3b34"/>
      <stop offset="1" stop-color="#0f2620"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6d1c9"/>
      <stop offset="1" stop-color="#b9b2a6"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" rx="0" fill="url(#bg)"/>

  <!-- subtle grid dots -->
  <g fill="#d6d1c9" opacity="0.06">
    <circle cx="1080" cy="60" r="3"/>
    <circle cx="1130" cy="60" r="3"/>
    <circle cx="1180" cy="60" r="3"/>
    <circle cx="1230" cy="60" r="3"/>
    <circle cx="1080" cy="110" r="3"/>
    <circle cx="1130" cy="110" r="3"/>
    <circle cx="1180" cy="110" r="3"/>
    <circle cx="1230" cy="110" r="3"/>
    <circle cx="1080" cy="160" r="3"/>
    <circle cx="1130" cy="160" r="3"/>
    <circle cx="1180" cy="160" r="3"/>
    <circle cx="1230" cy="160" r="3"/>
  </g>

  <!-- left accent bar -->
  <rect x="0" y="0" width="10" height="320" fill="url(#accent)"/>

  <!-- scales of justice -->
  <g transform="translate(110, 160)" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- central column -->
    <line x1="0" y1="-78" x2="0" y2="70"/>
    <!-- base -->
    <line x1="-40" y1="70" x2="40" y2="70"/>
    <line x1="-22" y1="70" x2="-22" y2="58"/>
    <line x1="22" y1="70" x2="22" y2="58"/>
    <!-- beam -->
    <line x1="-72" y1="-62" x2="72" y2="-62"/>
    <!-- top knob -->
    <circle cx="0" cy="-78" r="6" fill="url(#accent)" stroke="none"/>
    <!-- left strings -->
    <line x1="-72" y1="-62" x2="-92" y2="-12"/>
    <line x1="-72" y1="-62" x2="-52" y2="-12"/>
    <!-- left pan -->
    <path d="M -98 -12 A 26 18 0 0 0 -46 -12 Z" fill="url(#accent)" stroke="none" opacity="0.92"/>
    <!-- right strings -->
    <line x1="72" y1="-62" x2="52" y2="-12"/>
    <line x1="72" y1="-62" x2="92" y2="-12"/>
    <!-- right pan -->
    <path d="M 46 -12 A 26 18 0 0 0 98 -12 Z" fill="url(#accent)" stroke="none" opacity="0.92"/>
  </g>

  <!-- title -->
  <text x="240" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#d6d1c9">Automação LegalOne</text>

  <!-- subtitle -->
  <text x="242" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a9b5ad">Cadastro automático de processos a partir de petições</text>

  <!-- tags -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <g transform="translate(242, 228)">
      <rect width="118" height="34" rx="17" fill="#d6d1c9" opacity="0.12"/>
      <text x="59" y="22" fill="#d6d1c9" text-anchor="middle">Copilot Studio</text>
    </g>
    <g transform="translate(372, 228)">
      <rect width="100" height="34" rx="17" fill="#d6d1c9" opacity="0.12"/>
      <text x="50" y="22" fill="#d6d1c9" text-anchor="middle">Playwright</text>
    </g>
    <g transform="translate(484, 228)">
      <rect width="74" height="34" rx="17" fill="#d6d1c9" opacity="0.12"/>
      <text x="37" y="22" fill="#d6d1c9" text-anchor="middle">FastAPI</text>
    </g>
    <g transform="translate(570, 228)">
      <rect width="120" height="34" rx="17" fill="#d6d1c9" opacity="0.12"/>
      <text x="60" y="22" fill="#d6d1c9" text-anchor="middle">Microsoft Graph</text>
    </g>
  </g>

  <!-- firm mark -->
  <text x="1240" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#d6d1c9" text-anchor="end" opacity="0.7">Carvalho &amp; Furtado ⚖</text>
</svg>
